  <head>
    <meta charset="UTF-8" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://thepeopleslaw.app/" />
    <meta property="og:title" content="The People's Law | Expert AI Legal Assistant" />
    <meta property="og:description" content="Master US Law. Draft documents, learn your rights, and explore the Constitution with The People's Law. Free, private, and educational." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1589829085413-56de8ae18c73?auto=format&fit=crop&q=80&w=1200&h=630" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS for Layout and Styling -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              legal: {
                navy: '#0f172a',
                parchment: '#fdfcf6',
                gold: '#b45309',
                charcoal: '#334155'
              }
            },
            fontFamily: {
              serif: ['Merriweather', 'serif'],
              sans: ['Inter', 'sans-serif'],
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out',
              'fade-in-up': 'fadeInUp 0.6s ease-out forwards',
              'slide-up': 'slideUp 0.4s ease-out forwards',
              'shake': 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both'
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              slideUp: {
                '0%': { transform: 'translateY(20px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              shake: {
                '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
                '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
                '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
                '40%, 60%': { transform: 'translate3d(4px, 0, 0)' }
              }
            }
          }
        }
      }
    </script>

    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      h1, h2, h3, h4, h5, h6, .serif {
        font-family: 'Merriweather', serif;
      }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #a8a29e; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #78716c; }

      @media print {
        aside, .no-print, button:not(.print-visible), .bg-gradient-to-t, header { display: none !important; }
        body, #root, main, .overflow-y-auto { height: auto !important; overflow: visible !important; background-color: white !important; }
        .bg-stone-800 { background-color: white !important; color: black !important; border: 1px solid #ccc !important; }
        .text-stone-100 { color: black !important; }
        .bg-\[\#fafaf9\] { background-color: white !important; border: none !important; }
        .rounded-full.flex-shrink-0 { display: none !important; }
        .shadow-sm, .shadow-2xl { box-shadow: none !important; }
      }
    </style>

  }
}
</script>
